<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    The reader's own pointer while it is over the clap zone, so the greeting is two hands
    meeting rather than an arrow poking one.

    A file at the public root rather than inline chrome, and that is forced: a CSS `cursor`
    takes a URL, so there is nothing to inline into. It is deliberately not in public/media/ —
    that pool is reference-counted against content/media.json and anything without a content
    record there is reported as an orphan and swept.

    Same three paths as the hand in FigmaCursor, with the orange swapped for near-black: the
    site's hand is the orange one, and two identical hands would read as one object doubled
    rather than as someone arriving to meet it.
  -->
